<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;width:340px;background:#fff;color:#1a1a1a}
.header{background:#e67e22;padding:12px 14px;display:flex;align-items:center;gap:10px}
.header-text h1{color:#fff;font-size:14px;font-weight:700;margin:0}
.header-text p{color:rgba(255,255,255,.8);font-size:11px;margin:0}
.body{padding:14px}
.status{font-size:13px;color:#888;text-align:center;padding:16px 0}
.info{background:#fef9f0;border:1px solid #f5deb3;border-radius:8px;padding:12px;margin-bottom:10px}
.num{font-size:22px;font-weight:700;color:#e67e22}
.det{font-size:12px;color:#666;margin-top:3px}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px}
.btn-ok{background:#27ae60;color:#fff}
.btn-ok:disabled{background:#aaa}
.btn-sec{background:#f0f0f0;color:#333}
.btn-check{background:#2c3e50;color:#fff}
.btn-warn{background:#fdecea;color:#c0392b;border:1px solid #f5c6cb}
.sep{border:none;border-top:1px solid #eee;margin:8px 0}
.ck-res{display:flex;align-items:center;gap:12px;border-radius:10px;padding:14px 14px;margin-bottom:10px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.ck-ico{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
.ck-tit{font-size:17px;font-weight:900;letter-spacing:.3px;line-height:1.1}
.ck-sub{font-size:11.5px;font-weight:500;opacity:.95;margin-top:3px}
.ck-ban-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.ck-ban-bad{background:linear-gradient(135deg,#dc2626,#b91c1c);animation:pulso 1.2s ease-in-out 2}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.ck-list{max-height:330px;overflow-y:auto;margin-bottom:8px;border:1px solid #eee;border-radius:8px}
.ck-item{display:flex;gap:8px;padding:7px 9px;font-size:12px;border-bottom:1px solid #f2f2f2;align-items:flex-start}
.ck-item:last-child{border-bottom:none}
.ck-erro{background:#fef2f2;border-left:4px solid #dc2626}
.ck-erro b{color:#b91c1c}
.ck-ok{background:#fff}
.ck-aviso{border-left:4px solid #f59e0b}
.ck-aviso{background:#fffbea}
.ck-msg{color:#666;font-size:11px;margin-top:1px}
.erro{background:#fdecea;border:1px solid #f5c6cb;border-radius:6px;padding:10px;font-size:12px;color:#c0392b;margin-bottom:8px}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:22px">🚚</span>
  <div class="header-text">
    <h1>Mais Acessível</h1>
    <p>Cotação de Frete</p>
  </div>
</div>
<div class="body" id="body">
  <p class="status">Carregando...</p>
</div>
<script src="popup.js"></script>
</body>
</html>
