<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>💬 Chat — Mais Acessível</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f7;color:#1c1c1e;display:flex;flex-direction:column;font-size:14px}
.top{background:#5856d6;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.top h1{font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:11px;font-weight:400;opacity:.85}
.top button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.3)}
.aviso{background:#fffbeb;border-bottom:3px solid #f59e0b;padding:14px;flex-shrink:0;animation:pisca .5s ease-in-out 4}
@keyframes pisca{50%{background:#fde68a}}
.aviso .t{font-size:12px;font-weight:800;color:#b45309;letter-spacing:.4px}
.aviso .de{font-size:13px;color:#92400e;margin-top:2px}
.aviso .x{font-size:17px;font-weight:600;color:#1c1917;margin:8px 0 10px;white-space:pre-wrap;word-wrap:break-word;line-height:1.35}
.aviso button{width:100%;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:800;cursor:pointer}
.busca{margin:10px;border:1.5px solid #d1d5db;border-radius:9px;padding:8px 10px;font-size:14px;font-family:inherit;flex-shrink:0}
.lista{flex:1;overflow:auto;background:#fff}
.it{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.it:hover{background:#f3f3ff}
.av{flex:0 0 38px;height:38px;border-radius:50%;background:#5856d6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.av.todos{background:#f59e0b;font-size:18px}
.it .tx{flex:1;min-width:0}
.it .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.it .nm small{font-weight:500;color:#9ca3af;font-size:11px;white-space:nowrap}
.it .pv{font-size:12.5px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .pv.nl{color:#111;font-weight:700}
.bd{background:#ef4444;color:#fff;border-radius:9px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.vazio{margin:auto;color:#9ca3af;text-align:center;padding:20px;line-height:1.5}
.m{max-width:82%;padding:7px 10px;border-radius:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.m.ele{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.m.eu{align-self:flex-end;background:#5856d6;color:#fff;border-bottom-right-radius:4px}
.m.aw{border:2px solid #f59e0b}.m.aw.eu{background:#b45309}
.m .tg{display:block;font-size:11px;font-weight:800;margin-bottom:2px}
.m .qm{display:block;font-size:11.5px;font-weight:700;color:#5856d6;margin-bottom:1px}
.m .hr{display:block;font-size:10.5px;opacity:.65;text-align:right;margin-top:3px}
.comp{border-top:1px solid #e5e7eb;padding:8px;display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;background:#fff;flex-shrink:0}
.comp textarea{flex:1;min-width:150px;border:1.5px solid #d1d5db;border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;resize:none;max-height:120px;min-height:38px}
.comp .env{background:#5856d6;color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:14px}
.comp .env:disabled{opacity:.6}
.comp label{width:100%;font-size:12.5px;color:#92400e;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.info{margin:16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px;color:#1e3a8a;line-height:1.5}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="top"><button id="voltar" class="oculto" title="Voltar">‹</button><h1 id="titulo">💬 Chat<small id="sub">Mais Acessível</small></h1></div>
<div id="aviso" class="aviso oculto"></div>
<input id="busca" class="busca" placeholder="🔎 Procurar pessoa...">
<div id="lista" class="lista"></div>
<div id="msgs" class="msgs oculto"></div>
<div id="comp" class="comp oculto">
  <label id="lblAv" class="oculto"><input type="checkbox" id="chkAv"> 🔔 Aviso na tela (aparece na frente de tudo até ele clicar em Ciente)</label>
  <textarea id="txt" rows="1" placeholder="Mensagem... (Enter envia)"></textarea>
  <button class="env" id="enviar">Enviar ➤</button>
</div>
<script src="fb-auth.js"></script>
<script src="chat.js"></script>
</body>
</html>
