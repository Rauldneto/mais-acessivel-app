<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento PIX · Mais Acessível</title>
<meta property="og:title" content="Pagamento PIX · Mais Acessível">
<meta property="og:description" content="Link seguro para pagamento via PIX · Recebedor JDFER Comércio e Serviços Ltda">
<meta property="og:image" content="/logo.jpg">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a7d6b">
<link rel="icon" href="/logo.jpg">
<!-- Site de pagamento da Mais Acessível (Cloudflare Pages: maisacessivel.pages.dev).
     Link do cliente: /p/CODIGO → os dados vêm do servidor da empresa (/p/CODIGO.json). Nada é gravado aqui. -->
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1c1c1e;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(135deg,#0a7d6b,#075e51);color:#fff;padding:16px 18px 64px}.tl{display:flex;align-items:center;gap:12px;max-width:460px;margin:0 auto}
.tl img{height:46px;background:#fff;border-radius:12px;padding:5px 9px}.tl b{font-size:17px;display:block}.tl small{opacity:.9;font-size:12.5px}
.seg{display:flex;align-items:center;justify-content:center;gap:6px;max-width:460px;margin:12px auto 0;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px}
.wrap{padding:0 14px}.card{background:#fff;margin:-46px auto 14px;max-width:460px;border-radius:22px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.ref{font-size:14px;color:#636366}.val{font-size:42px;font-weight:800;color:#0a7d6b;margin:4px 0 2px;letter-spacing:-.5px}
.vld{display:inline-block;font-size:13px;color:#92400e;background:#fef3c7;border-radius:999px;padding:4px 12px;font-weight:600}.cli{font-size:13px;color:#636366;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:#16a34a;color:#fff;font:inherit;font-size:17px;font-weight:800;padding:16px;margin-top:16px;cursor:pointer}
.btn.sec{background:#fff;color:#0a7d6b;border:2px solid #0a7d6b;margin-top:10px}.btn.ok{background:#0a7d6b;color:#fff;border-color:#0a7d6b}
.msg{font-size:13px;color:#15803d;margin-top:8px;min-height:18px}
.passos{text-align:left;background:#f7f9f8;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.6}.passos b{color:#0a7d6b}
.conf{max-width:460px;margin:0 auto 14px;background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.conf h3{margin:0 0 10px;font-size:15px}.ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #f0f0f3;font-size:13.5px}.ln span{color:#636366}.ln b{text-align:right}
.alerta{margin-top:10px;font-size:12.5px;color:#475569;background:#f1f5f9;border-radius:12px;padding:10px 12px;line-height:1.5}
.qr{margin:14px auto 4px;width:190px;min-height:190px}.qr svg{width:190px;height:190px}.ou{font-size:12px;color:#8e8e93}
details{margin-top:12px;text-align:left}summary{cursor:pointer;color:#0a7d6b;font-weight:700;font-size:14px}
.cod{width:100%;margin-top:8px;font-size:11px;font-family:monospace;border:1px solid #e5e5ea;border-radius:10px;padding:8px;height:70px;resize:none;color:#555}
.st{font-size:22px;font-weight:800;margin:12px 0 6px}.st.pago{color:#16a34a}.st.off{color:#b91c1c}
.rod{font-size:12px;color:#8e8e93;text-align:center;padding:4px 20px 26px;line-height:1.6}
.carr{padding:40px 0;color:#636366}.sp{width:28px;height:28px;border:3px solid #d1d5db;border-top-color:#0a7d6b;border-radius:50%;margin:0 auto 10px;animation:g .8s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div class="tl"><img src="/logo.jpg" alt="Mais Acessível"><div><b>Mais Acessível</b><small>JDFER Comércio e Serviços Ltda</small></div></div>
<div class="seg">🔒 Pagamento seguro via PIX · Banco Sicoob</div></div>
<div class="wrap" id="app"><div class="card"><div class="carr"><div class="sp"></div>Carregando o pagamento…</div></div></div>
<div class="rod">Mais Acessível · Goiânia/GO<br>Nunca pedimos senha, código de verificação ou dados de cartão.</div>
<script src="/qrcode.js"></script>
<script>
(function(){
  var SERVIDOR='https://bling.rauldias.workers.dev';
  var app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var brl=function(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});};
  var m=location.pathname.match(/\/p\/([A-Za-z0-9]{4,12})/)||location.search.match(/[?&]c=([A-Za-z0-9]{4,12})/);
  var cod=m?m[1].toUpperCase():'';
  var erro=function(t,txt){app.innerHTML='<div class="card"><div class="st off">'+t+'</div><p>'+txt+'</p></div>';};
  if(!cod)return erro('Link incompleto','Confira se o link foi copiado inteiro ou peça um novo para quem te atendeu.');
  fetch(SERVIDOR+'/p/'+cod+'.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)return erro('Link não encontrado','Este link de pagamento não existe ou já expirou. Fale com quem te atendeu para receber um novo.');
    var ref=(d.tipo==='nota'?'Nota fiscal nº ':'Pedido nº ')+esc(d.numero);
    var dt=new Date(d.expira),validade=dt.toLocaleDateString('pt-BR')+' às '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    document.title='Pagamento PIX · Mais Acessível · '+(d.tipo==='nota'?'NF ':'Pedido ')+d.numero;
    var topo='<div class="ref">'+ref+'</div><div class="val">R$ '+brl(d.valor)+'</div>';
    if(d.status==='PAGO')return app.innerHTML='<div class="card">'+topo+'<div class="st pago">✅ Pagamento recebido</div><p>Obrigado! Já recebemos este pagamento. Não é preciso pagar de novo.</p></div>';
    if(d.status==='CANCELADA')return app.innerHTML='<div class="card">'+topo+'<div class="st off">PIX cancelado</div><p>Este PIX foi cancelado. Fale com quem te atendeu para receber um novo link.</p></div>';
    if(d.status==='VENCIDA')return app.innerHTML='<div class="card">'+topo+'<div class="st off">PIX vencido</div><p>Este PIX venceu em '+validade+'. Fale com quem te atendeu para receber um novo link.</p></div>';
    app.innerHTML='<div class="card">'+topo+'<div class="vld">⏰ Válido até '+validade+'</div>'+(d.cliente?'<div class="cli">'+esc(d.cliente)+'</div>':'')+
      '<button class="btn" id="banco">🏦 Pagar no app do meu banco</button>'+
      '<button class="btn sec" id="cp">📋 Copiar código PIX</button><div class="msg" id="msg"></div>'+
      '<div class="passos"><b>1.</b> Toque em <b>Pagar no app do meu banco</b> (ou copie o código)<br><b>2.</b> No app do banco, entre em <b>PIX › Pix Copia e Cola</b><br><b>3.</b> Cole o código, <b>confira o recebedor</b> abaixo e confirme</div>'+
      '<details><summary>Ver o código PIX</summary><textarea class="cod" id="cod" readonly>'+esc(d.copia)+'</textarea></details>'+
      '<div class="qr" id="qr"></div><div class="ou">No computador? Leia o QR Code com a câmera do app do banco.</div></div>'+
      '<div class="conf"><h3>🛡️ Confira antes de pagar</h3>'+
      '<div class="ln"><span>Recebedor</span><b>JDFER COMÉRCIO E SERVIÇOS LTDA</b></div>'+
      '<div class="ln"><span>CNPJ</span><b>35.017.646/0001-66</b></div>'+
      '<div class="ln"><span>Banco</span><b>Sicoob</b></div>'+
      '<div class="ln"><span>Valor</span><b>R$ '+brl(d.valor)+'</b></div>'+
      '<div class="ln"><span>Referente a</span><b>'+ref+'</b></div>'+
      '<div class="alerta">No app do seu banco, antes de confirmar, o recebedor deve aparecer como <b>JDFER COMÉRCIO E SERVIÇOS LTDA</b> e o valor deve ser <b>R$ '+brl(d.valor)+'</b>. Se algo for diferente, não pague e fale com a gente.</div></div>';
    var c=d.copia,msg=document.getElementById('msg');
    var copiar=function(fim){var ok=function(){fim(true);};try{navigator.clipboard.writeText(c).then(ok).catch(function(){var t=document.getElementById('cod');t.parentNode.open=true;t.select();try{document.execCommand('copy');ok();}catch(e){fim(false);}});}catch(e){fim(false);}};
    document.getElementById('cp').onclick=function(){var b=this;copiar(function(ok){if(ok){b.textContent='✓ Código copiado';b.className='btn ok';msg.textContent='Agora abra o app do seu banco › PIX › Pix Copia e Cola e cole o código.';}else{document.querySelector('details').open=true;msg.textContent='Selecione o código abaixo e copie.';}});};
    document.getElementById('banco').onclick=function(){copiar(function(){
      if(navigator.share){navigator.share({text:c}).catch(function(){});msg.textContent='Código copiado. Escolha o app do seu banco na lista, ou abra o banco e use Pix Copia e Cola.';}
      else msg.textContent='Código copiado. Abra o app do seu banco › PIX › Pix Copia e Cola e cole.';});};
    try{var q=qrcode(0,'M');q.addData(c);q.make();document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:1});}catch(e){}
  }).catch(function(){erro('Sem conexão','Não foi possível carregar o pagamento. Verifique sua internet e tente de novo.');});
})();
</script>
</body>
</html>
